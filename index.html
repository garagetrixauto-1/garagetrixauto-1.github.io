<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRIX AUTO">
<title>TRIX AUTO</title>
</head>
<body style="margin:0;background:#0d0d0d;color:#d6b06a;font:600 18px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh">
<p id="m">Chargement de TRIX AUTO…</p>
<script>
/* L'appli est stockée dans Google Apps Script : cette page la charge, ce qui permet la caméra et marche sur tous les téléphones. */
var U = "https://script.google.com/macros/s/AKfycbxBQf5PdQOGzkZ37buytBqaHy3EVxzHSYIkxPKXs_p0-Cp5o0cVEgRWyLp8MKtpEUCj/exec?action=page";
fetch(U)
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (h) { document.open(); document.write(h); document.close(); })
  .catch(function () { document.getElementById("m").textContent = "Pas de connexion. Rechargez la page."; });
</script>
</body>
</html>
